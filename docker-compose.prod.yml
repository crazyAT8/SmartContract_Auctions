# Production Compose overlay (no Hardhat; secrets via env files)
#
# Setup:
#   cp backend/env.production.example backend/.env.production
#   cp frontend/env.production.example frontend/.env.production
#   # Edit both files with real DB/Redis/RPC/JWT/PRIVATE_KEY and public URLs
#   # Deploy contracts to the target network; update contracts/deployments.json
#   export POSTGRES_USER=... POSTGRES_PASSWORD=... REDIS_PASSWORD=...
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Local Hardhat stays disabled (base compose already puts it behind profile local-chain).
# Backend validateEnv refuses Hardhat keys, localhost RPC, and placeholder secrets
# when NODE_ENV=production.

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction_dapp}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]

  backend:
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-auction_dapp}?schema=public
      CONTRACT_ADDRESSES_JSON: /app/contracts/deployments.json
    volumes:
      - ./contracts/deployments.json:/app/contracts/deployments.json:ro
    restart: unless-stopped

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_ETHEREUM_RPC_URL: ${NEXT_PUBLIC_ETHEREUM_RPC_URL:?Set NEXT_PUBLIC_ETHEREUM_RPC_URL}
    env_file:
      - ./frontend/.env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
